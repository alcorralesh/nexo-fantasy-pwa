name: Publicar Nexo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generar web estática
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /nexo-fantasy-pwa
          NEXT_PUBLIC_SITE_URL: https://alcorralesh.github.io/nexo-fantasy-pwa
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build:pages
      - name: Evitar procesamiento de Jekyll
        run: touch out/.nojekyll
      - name: Subir web generada
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
